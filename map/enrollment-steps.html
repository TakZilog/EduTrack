<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack - Enrollment steps</title>
<meta name="description" content="The ACLC College Mandaue enrollment steps in order, with a photo walkthrough to every office and room along the way.">
<meta name="theme-color" content="#0044d6">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<style>
  /*
    The clearance form made walkable: one ordered list, a floor numeral for
    every stop the way the room picker uses one for every floor, a photo
    where a real one exists, and a straight line into the same gate-to-room
    walkthrough the rest of the product already builds routes with.
  */
  .page { padding-top: clamp(24px, 5vw, 40px); }

  .page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--s3); }
  .page-head .head-text { min-width: 0; flex: 1 1 320px; }

  .track-switch {
    display: inline-flex;
    align-items: center;
    gap: var(--s2);
    min-height: 44px;
    padding: 0 var(--s4);
    border: 1px solid var(--border-control);
    border-radius: var(--r-btn);
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
    transition: border-color .15s var(--ease), color .15s var(--ease);
  }
  @media (hover: hover) and (pointer: fine) {
    .track-switch:hover { border-color: var(--blue); color: var(--blue); }
  }

  .gate-note {
    display: inline-flex;
    align-items: center;
    gap: var(--s2);
    margin: var(--s3) 0 0;
    color: var(--red-deep);
    font-size: var(--fs-sm);
    font-weight: 600;
  }
  .gate-note svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--red); }

  /* --------------------------------------------------------------- steps */

  .step-list {
    position: relative;
    margin: var(--s6) 0 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: var(--s4);
  }

  /* The connecting line behind every numeral: the corridor between stops,
     drawn in Directory Blue like a route on a wall directory. */
  .step-list::before {
    content: "";
    position: absolute;
    top: 26px;
    bottom: 26px;
    left: 24.5px;
    width: 3px;
    background: var(--blue);
  }
  @media (max-width: 479px) {
    .step-list::before { left: 20.5px; }
  }

  .step-card {
    position: relative;
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: var(--s4);
    padding: var(--s4) var(--s4) var(--s5);
    background: var(--surface);
    border: 1px solid color-mix(in oklch, var(--blue) 40%, var(--border));
    border-radius: var(--r-panel);
  }
  @media (max-width: 479px) {
    .step-card { grid-template-columns: 42px 1fr; padding: var(--s3) var(--s3) var(--s4); }
  }

  .step-num {
    position: relative;
    z-index: 1;
  }
  @media (max-width: 479px) {
    .step-num { width: 42px; height: 42px; font-size: var(--fs-h3); }
  }

  .step-body { min-width: 0; display: grid; gap: var(--s2); align-content: start; }

  .step-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s2) var(--s3); }
  .step-title { margin: 0; font-family: var(--font-display); font-size: var(--fs-h2); font-weight: 700; line-height: 1.15; }

  .step-office {
    display: inline-flex;
    align-items: center;
    padding: 2px var(--s2);
    border-radius: var(--r-chip);
    background: var(--blue);
    color: var(--white);
    font-size: var(--fs-sm);
    font-weight: 600;
  }

  .step-detail { margin: 0; color: var(--text-muted); }

  .step-media {
    display: flex;
    align-items: center;
    gap: var(--s3);
    margin-top: var(--s1);
  }
  .step-photo {
    width: 96px;
    height: 72px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: var(--r-chip);
    border: 1px solid var(--border);
    background: var(--bg);
  }
  .step-placeholder {
    display: inline-grid;
    place-items: center;
    width: 96px;
    height: 72px;
    flex-shrink: 0;
    border-radius: var(--r-chip);
    border: 1px dashed var(--border-strong);
    background: var(--bg);
    color: var(--text-muted);
  }
  .step-placeholder svg { width: 28px; height: 28px; }

  .step-route {
    display: inline-flex;
    align-items: center;
    gap: var(--s2);
    min-height: 44px;
    padding: 0 var(--s4);
    width: max-content;
    border-radius: var(--r-btn);
    background: var(--blue);
    color: var(--white);
    font-weight: 700;
    text-decoration: none;
    transition: background-color .15s var(--ease);
  }
  .step-route svg { width: 18px; height: 18px; transition: transform .15s var(--ease); }
  @media (hover: hover) and (pointer: fine) {
    .step-route:hover { background: var(--blue-deep); }
    .step-route:hover svg { transform: translateX(3px); }
  }

  /* ------------------------------------------------------------ substeps */

  .substeps { margin: var(--s2) 0 0; padding: 0; list-style: none; display: grid; gap: var(--s3); }
  .substep {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--s3);
    padding: var(--s3);
    background: var(--bg);
    border-radius: var(--r-chip);
  }
  .substep-order {
    display: inline-grid;
    place-items: center;
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text-muted);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: var(--fs-sm);
  }
  .substep-label { flex: 1 1 160px; min-width: 0; font-weight: 600; }
  .substep .step-route { min-height: 40px; padding: 0 var(--s3); font-size: var(--fs-sm); }
  .substep .step-placeholder { width: 40px; height: 40px; border-radius: 50%; }
  .substep .step-placeholder svg { width: 18px; height: 18px; }
  .substep .step-photo { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }

  /* --------------------------------------------------------------- empty */

  .empty-state {
    display: grid;
    justify-items: start;
    gap: var(--s3);
    margin-top: var(--s6);
    padding: var(--s7) var(--s5);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-panel);
    text-align: left;
  }
  .empty-state svg { width: 40px; height: 40px; color: var(--text-muted); }
  .empty-state h2 { margin: 0; font-size: var(--fs-h2); }
  .empty-state p { margin: 0; color: var(--text-muted); max-width: 44ch; }

  /* ------------------------------------------------------------- progress */

  .progress-bar {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: var(--s2) var(--s3);
    margin: var(--s6) 0 0;
  }
  .progress-bar + .step-list { margin-top: var(--s4); }
  .progress-text { margin: 0; font-weight: 600; }
  .progress-track {
    grid-column: 1 / -1;
    grid-row: 2;
    height: 8px;
    border-radius: 999px;
    background: var(--blue-wash);
    overflow: hidden;
  }
  .progress-fill {
    display: block;
    height: 100%;
    background: var(--blue);
    transition: width .3s var(--ease);
  }
  .progress-reset {
    min-height: 36px;
    padding: 0 var(--s3);
    border: 1px solid var(--border-control);
    border-radius: var(--r-btn);
    background: var(--surface);
    color: var(--text-muted);
    font: inherit;
    font-size: var(--fs-sm);
    cursor: pointer;
  }
  @media (hover: hover) {
    .progress-reset:hover { border-color: var(--blue); color: var(--blue); }
  }

  .next-tag {
    padding: 2px var(--s2);
    border-radius: var(--r-chip);
    background: var(--red);
    color: var(--white);
    font-size: var(--fs-sm);
    font-weight: 600;
  }
  .next-tag[hidden] { display: none; }
  .step-card.is-next { border-color: var(--blue); box-shadow: var(--shadow); }

  .step-done {
    justify-self: start;
    display: inline-flex;
    align-items: center;
    gap: var(--s2);
    min-height: 44px;
    margin-top: var(--s2);
    padding: 0 var(--s4);
    border: 1px solid var(--border-control);
    border-radius: var(--r-btn);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s var(--ease), background-color .15s var(--ease), color .15s var(--ease);
  }
  .step-done svg { width: 18px; height: 18px; }
  @media (hover: hover) {
    .step-done:hover { border-color: var(--blue); color: var(--blue); }
  }
  .step-done[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--white); }

  /* A finished step stays readable and clickable, just quieter, so it can
     still be opened again or unmarked. */
  .step-card.is-done .step-title,
  .step-card.is-done .step-detail { color: var(--text-muted); }
  .step-card.is-done .step-media,
  .step-card.is-done .substeps { opacity: .6; }
</style>
</head>
<body>

  <header class="brand">
    <a class="brand-link" href="../index.html" aria-label="EduTrack home">
      <img class="brand-seal" src="../assets/img/aclc-logo.jpg" width="56" height="56" alt="">
      <span class="brand-text">
        <span class="brand-mark">EduTrack</span>
        <span class="brand-sub">ACLC College, Mandaue Campus</span>
      </span>
    </a>
  </header>

  <main class="page fade-in" id="main">
    <a class="back-link" href="enrollment.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Change track
    </a>

    <div class="page-head">
      <div class="head-text">
        <h1 class="page-title" id="pageTitle">Enrollment steps</h1>
        <p class="page-lede" id="pageLede">Follow these in order. Every step with a room links straight to the walkthrough from the gate.</p>
        <p class="gate-note">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a8 8 0 0 0-8 8c0 6 8 12 8 12s8-6 8-12a8 8 0 0 0-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
          Every route starts at the main gate.
        </p>
      </div>
    </div>

    <ol class="step-list" id="stepList" aria-live="polite"></ol>
  </main>

  <script src="enrollment-steps.js?v=4"></script>
</body>
</html>
