<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EduTrack — Walkthrough</title>
  <meta name="description" content="Walk to your room through real 360° photos of the ACLC College Mandaue Admin Building.">
  <!-- Dark, not brand blue: this is the one full-bleed surface, and the
       browser chrome should recede into the panorama rather than announce
       a colour the screen does not contain. -->
  <meta name="theme-color" content="#1A1A1A">
  <link rel="icon" href="../assets/img/aclc-logo.jpg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /*
      The one screen in the product that is not a light document: a 360° photo
      fills the viewport and the UI floats over it. Legibility over an unknown
      photograph is the whole problem here, and it is solved with solid bars —
      never backdrop-filter, which composites every frame the panorama moves.

      Worst case for the bars is a white-walled corridor: at 88% the bar still
      resolves to roughly #383838, where white text measures 11:1.
    */
    :root {
      --bar: rgba(26, 26, 26, .88);   /* Text Main, held at 88% */
      --on-bar: #FFFFFF;
      --on-bar-dim: rgba(255, 255, 255, .75);
      --hairline: rgba(255, 255, 255, .38);
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      font-family: var(--font);
      overflow: hidden;
    }

    #panorama { width: 100%; height: 100%; }

    /* Pannellum ships its own title box — location lives in #topBar instead,
       so suppress theirs rather than show the same thing twice. */
    .pnlm-title-box { display: none !important; }

    /* ------------------------------------------------------------- top bar */

    #topBar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: var(--s2);
      padding:
        calc(var(--s3) + var(--s2) + env(safe-area-inset-top))
        calc(var(--s4) + env(safe-area-inset-right))
        var(--s3)
        calc(var(--s4) + env(safe-area-inset-left));
      background: var(--bar);
      color: var(--on-bar);
    }

    #backLink {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: var(--s2);
      min-height: 44px;      /* the target, even though the text is small */
      color: var(--on-bar);
      font-size: var(--fs-sm);
      font-weight: 600;
      text-decoration: none;
    }

    #backLink svg {
      width: 18px; height: 18px;
      flex-shrink: 0;
      transition: transform .15s var(--ease);
    }

    @media (hover: hover) and (pointer: fine) {
      #backLink:hover svg { transform: translateX(-3px); }
    }

    #backLink:focus-visible {
      outline: 2px solid var(--on-bar);
      outline-offset: 2px;
      border-radius: var(--r-input);
    }

    /* Label and counter share a baseline. min-width:0 lets the label wrap
       instead of pushing the counter off-screen — "Student Affairs Office" and
       "Property Custodian" are real labels in this data. */
    #stepInfo {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--s3);
    }

    #stepLabel {
      min-width: 0;
      font-size: var(--fs-h2);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.01em;
      overflow-wrap: break-word;
    }

    #stepCount {
      flex-shrink: 0;
      color: var(--on-bar-dim);
      font-size: var(--fs-sm);
      font-variant-numeric: tabular-nums;   /* the counter stops twitching as it climbs */
    }

    /* --------------------------------------------------------- route strip */

    #routeStrip {
      position: fixed;
      top: env(safe-area-inset-top);
      left: 0; right: 0;
      z-index: 11;
      display: flex;
      gap: 3px;
      height: 4px;
      padding: 0 calc(var(--s4) + env(safe-area-inset-right)) 0 calc(var(--s4) + env(safe-area-inset-left));
      pointer-events: none;
    }

    #routeStrip .tick {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, .28);
      transition: background .2s var(--ease);
    }

    #routeStrip .tick.done { background: rgba(255, 255, 255, .7); }

    /* "You are here" — wayfinding's own use of red, and the only red on the
       screen. Never the sole signal: #stepCount states the position in words. */
    #routeStrip .tick.current { background: var(--red); }

    /* --------------------------------------------------------- controls */

    #controls {
      position: fixed;
      bottom: calc(var(--s5) + env(safe-area-inset-bottom));
      left: env(safe-area-inset-left);
      right: env(safe-area-inset-right);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--s3);
      padding: 0 var(--s4);
    }

    .navBtn {
      display: inline-flex;
      align-items: center;
      gap: var(--s2);
      min-height: 48px;
      padding: var(--s3) var(--s5);
      border: 1px solid var(--hairline);
      border-radius: var(--r-btn);
      background: var(--bar);
      color: var(--on-bar);
      font-family: var(--font);
      font-size: var(--fs-body);
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s var(--ease), transform .12s var(--ease);
    }

    .navBtn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .navBtn.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: var(--white);
    }

    @media (hover: hover) and (pointer: fine) {
      .navBtn:hover:not(:disabled) { opacity: .9; }
    }

    .navBtn:active:not(:disabled) { transform: scale(.97); }

    .navBtn:focus-visible {
      outline: 2px solid var(--on-bar);
      outline-offset: 2px;
    }

    .navBtn:disabled { opacity: .4; cursor: not-allowed; }

    /* ---------------------------------------------------- arrived banner */

    /*
      A plain white card, the same surface as every other page in the product.
      It replaces a frosted panel: over an unknown photograph, opaque is both
      more legible and far cheaper than a blur.
    */
    #arrivedBanner {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(.96);
      z-index: 20;
      display: none;
      width: min(320px, calc(100vw - 48px));
      padding: var(--s5);
      background: var(--surface);
      border-radius: var(--r-card);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .38);
      color: var(--text);
      text-align: center;
      opacity: 0;
      animation: arrive .28s ease-out forwards;
    }

    @keyframes arrive {
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    /* walkthrough.js removes the banner 250ms after adding .hiding, so this
       must not outrun that. Exit is also shorter than entry, which is what
       "responsive" feels like. */
    #arrivedBanner.hiding { animation: arrive-out .25s ease-out forwards; }

    @keyframes arrive-out {
      to { opacity: 0; transform: translate(-50%, -50%) scale(.96); }
    }

    #arrivedBanner .check {
      width: 44px; height: 44px;
      margin: 0 auto var(--s4);
      border-radius: 50%;
      background: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #arrivedBanner .eyebrow {
      margin: 0 0 var(--s1);
      color: var(--text-muted);
      font-size: var(--fs-sm);
    }

    #arrivedBanner h2 {
      margin: 0 0 var(--s5);
      font-size: var(--fs-h1);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.02em;
      overflow-wrap: break-word;
    }

    #arrivedBanner a {
      display: block;
      min-height: 48px;
      padding: var(--s3) var(--s4);
      border-radius: var(--r-btn);
      background: var(--blue);
      color: var(--white);
      font-size: var(--fs-body);
      font-weight: 600;
      line-height: 1.5;
      text-decoration: none;
      transition: opacity .15s var(--ease), transform .12s var(--ease);
    }

    @media (hover: hover) and (pointer: fine) {
      #arrivedBanner a:hover { opacity: .92; }
    }

    #arrivedBanner a:active { transform: scale(.98); }

    #arrivedBanner a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    /* ------------------------------------------------- in-scene waypoint */

    /*
      A solid marker, no pulse. The previous version ran a 2.2s scale/opacity
      keyframe forever on a pseudo-element — continuous motion on exactly the
      hardware this product targets. The white ring does the work the animation
      was doing: it separates the marker from whatever is behind it.
    */
    .hotspot-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px; height: 44px;
      box-sizing: border-box;
      background: var(--blue);
      border: 2px solid var(--white);
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .45);
      color: var(--white);
      cursor: pointer;
      transition: transform .12s var(--ease);
    }

    .hotspot-arrow svg { width: 18px; height: 18px; }

    .hotspot-arrow:active { transform: scale(.94); }

    .hotspot-arrow:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 3px;
    }

    /* ------------------------------------------------------ short viewports
       A phone turned landscape for a wider panorama: top chrome, bottom
       controls and the centred banner all get tight together on a ~360-420px
       tall viewport, so trim all three. */
    @media (max-height: 480px) {
      #topBar { padding-top: calc(var(--s2) + env(safe-area-inset-top)); padding-bottom: var(--s2); }
      #backLink { min-height: 36px; }
      #stepLabel { font-size: var(--fs-body); }
      #controls { bottom: calc(var(--s3) + env(safe-area-inset-bottom)); }
      .navBtn { min-height: 44px; padding: var(--s2) var(--s4); }
      #arrivedBanner { width: min(280px, calc(100vw - 48px)); padding: var(--s4); }
      #arrivedBanner .check { width: 36px; height: 36px; margin-bottom: var(--s3); }
      #arrivedBanner h2 { font-size: var(--fs-h2); margin-bottom: var(--s4); }
    }

    @media (prefers-reduced-motion: reduce) {
      #arrivedBanner {
        animation: none;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      .navBtn:active:not(:disabled),
      .hotspot-arrow:active,
      #arrivedBanner a:active { transform: none; }
      #backLink:hover svg { transform: none; }
    }
  </style>
</head>

<body>

  <div id="routeStrip"></div>

  <div id="topBar">
    <a id="backLink" href="select-room.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Choose different room
    </a>
    <div id="stepInfo">
      <span id="stepLabel">Loading…</span>
      <span id="stepCount"></span>
    </div>
  </div>

  <div id="panorama"></div>

  <div id="controls">
    <button class="navBtn" id="prevBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      Back
    </button>
    <button class="navBtn primary" id="nextBtn">
      Next
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <div id="arrivedBanner">
    <div class="check" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M4 10.5L8 14.5L16 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <p class="eyebrow">Destination reached</p>
    <h2 id="arrivedRoomName"></h2>
    <a href="select-room.html">Choose another room</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <script src="walkthrough.js?v=2"></script>
</body>

</html>
