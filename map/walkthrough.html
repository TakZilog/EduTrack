<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTrack - Walkthrough</title>
  <meta name="description" content="Walk to your room through real 360° photos of the ACLC College Mandaue Admin Building.">
  <!-- Dark, not brand blue: this is the one full-bleed surface, and the
       browser chrome should recede into the panorama rather than announce
       a colour the screen does not contain. -->
  <meta name="theme-color" content="#1A1A1A">
  <link rel="icon" href="../assets/img/aclc-logo.jpg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=7">
  <style>
    /*
      The one screen in the product that is not a light document: a 360° photo
      fills the viewport and the UI floats over it. Legibility over an unknown
      photograph is the whole problem here, and it is solved with solid bars —
      never backdrop-filter, which composites every frame the panorama moves.

      Worst case for the bars is a white-walled corridor: at 88% the bar still
      resolves to roughly #383838, where white text measures 11:1.
    */
    :root {
      --bar: rgba(26, 26, 26, .88);   /* Text Main, held at 88% */
      --on-bar: #FFFFFF;
      --on-bar-dim: rgba(255, 255, 255, .75);
      --hairline: rgba(255, 255, 255, .38);
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      font-family: var(--font);
      overflow: hidden;
    }
    /* The panorama fills the viewport edge to edge; no reserved gutter. */
    html { scrollbar-gutter: auto; }

    #panorama { width: 100%; height: 100%; }

    /* Pannellum ships its own title box — location lives in #topBar instead,
       so suppress theirs rather than show the same thing twice. */
    .pnlm-title-box { display: none !important; }

    /* ------------------------------------------------------------- top bar */

    /* One calm row at a fixed height: back, where you are, the seal. The
       place name never wraps (a long one is cut with an ellipsis), so the bar
       stays still as you step through the route. */
    #topBar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: var(--s4);
      height: 64px;
      padding: 0 var(--s4);
      background: var(--bar);
      color: var(--on-bar);
    }

    #backLink {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: var(--s2);
      min-height: 44px;
      color: var(--on-bar-dim);
      font-size: var(--fs-sm);
      font-weight: 500;
      text-decoration: none;
      transition: color .15s var(--ease);
    }
    #backLink svg { width: 18px; height: 18px; flex-shrink: 0; }
    #backLink:focus-visible { outline: 2px solid var(--on-bar); outline-offset: 2px; border-radius: var(--r-input); }

    #stepInfo {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: var(--s3);
    }
    #stepLabel {
      min-width: 0;
      font-size: var(--fs-h3);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #stepCount {
      flex-shrink: 0;
      color: var(--on-bar-dim);
      font-size: var(--fs-sm);
      font-variant-numeric: tabular-nums;   /* the counter stops twitching as it climbs */
    }

    /* The same seal and blue ring as the other pages, on the right. */
    #wtCrest {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: var(--s2);
      min-height: 44px;
      color: var(--on-bar);
      font-family: var(--font-display);
      font-size: var(--fs-body);
      font-weight: 600;
      text-decoration: none;
    }
    #wtCrest img {
      display: block;
      width: 30px; height: 30px;
      padding: 1px;
      border-radius: 50%;
      background: var(--white);
      box-shadow: 0 0 0 2px var(--blue);
    }
    #wtCrest:focus-visible { outline: 2px solid var(--on-bar); outline-offset: 2px; border-radius: var(--r-input); }

    /* Progress: one hairline along the bar's bottom edge. It fills without
       animating, so nothing at the top moves when you press Next; the count
       beside the place name says the step in words. */
    #routeProgress {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: rgba(255, 255, 255, .16);
    }
    #routeProgress span { display: block; width: 0; height: 100%; background: rgba(255, 255, 255, .8); }

    /* Phones: arrow and seal only, the place name above its count. The back
       link keeps its words for screen readers. */
    @media (max-width: 599px) {
      #backLink span, #wtCrest span {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap;
      }
      #backLink { justify-content: center; width: 44px; margin-left: calc(var(--s2) * -1); }
      #stepInfo { flex-direction: column; align-items: flex-start; gap: 0; }
      #stepLabel { max-width: 100%; }
    }

    @media (hover: hover) and (pointer: fine) {
      #backLink:hover { color: var(--on-bar); }
    }

    /* --------------------------------------------------------- controls */

    /* Walking happens on the arrows in the photo. These buttons stay for
       keyboard and screen reader users: out of sight until one of them has
       focus, then shown where they always were. */
    #controls {
      position: fixed;
      bottom: var(--s5);
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--s3);
      padding: 0 var(--s4);
    }
    #controls:not(:focus-within) {
      clip-path: inset(50%);
      height: 1px;
      overflow: hidden;
    }

    /* First step only: says once how to walk, then goes for good. */
    #walkHint {
      position: fixed;
      bottom: var(--s5);
      left: 50%;
      transform: translateX(-50%);
      z-index: 9;
      max-width: calc(100vw - 32px);
      margin: 0;
      padding: var(--s2) var(--s4);
      border-radius: var(--r-panel);
      background: var(--bar);
      color: var(--on-bar);
      font-size: var(--fs-sm);
      font-weight: 500;
      text-align: center;
      pointer-events: none;
    }
    #walkHint[hidden] { display: none; }
    #controls:focus-within ~ #walkHint { display: none; }

    .navBtn {
      display: inline-flex;
      align-items: center;
      gap: var(--s2);
      min-height: 48px;
      padding: var(--s3) var(--s5);
      border: 1px solid var(--hairline);
      border-radius: var(--r-btn);
      background: var(--bar);
      color: var(--on-bar);
      font-family: var(--font);
      font-size: var(--fs-body);
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s var(--ease), transform .12s var(--ease);
    }

    .navBtn svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Next wears the same bold condensed face as the Log in bar on home. */
    .navBtn.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: var(--white);
      font-family: var(--font-display);
      font-size: var(--fs-h3);
      font-weight: 700;
    }

    @media (hover: hover) and (pointer: fine) {
      .navBtn:hover:not(:disabled) { opacity: .9; }
    }

    .navBtn:active:not(:disabled) { transform: scale(.97); }

    .navBtn:focus-visible {
      outline: 2px solid var(--on-bar);
      outline-offset: 2px;
    }

    .navBtn:disabled { opacity: .4; cursor: not-allowed; }

    /* ---------------------------------------------------- arrived banner */

    /*
      Arrival is said once, quietly, in the top bar's own dark: a notice just
      under the bar that opens left to right like a sign being uncovered, its
      words a beat behind the edge. It never covers the room you came to see.
      Red is the pin, the "you are here" mark and nothing else.
    */
    #arrivedBanner {
      position: fixed;
      top: calc(64px + var(--s3));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: none;               /* walkthrough.js shows it as flex */
      align-items: center;
      gap: var(--s3);
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: var(--s2) var(--s2) var(--s2) var(--s4);
      border-radius: var(--r-panel);
      background: rgba(26, 26, 26, .92);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .3);
      color: var(--on-bar);
      animation: arrive-wipe .38s cubic-bezier(.16, 1, .3, 1) both;
    }
    #arrivedBanner > * { animation: arrive-words .24s .16s cubic-bezier(.16, 1, .3, 1) both; }

    @keyframes arrive-wipe {
      from { clip-path: inset(0 100% 0 0 round 6px); }
      to   { clip-path: inset(0 0 0 0 round 6px); }
    }
    @keyframes arrive-words {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }

    /* walkthrough.js removes the banner 250ms after adding .hiding, so this
       must not outrun that. It closes the way it opened, edge first. */
    #arrivedBanner.hiding { animation: arrive-unwipe .22s cubic-bezier(.7, 0, .84, 0) both; }
    #arrivedBanner.hiding > * { animation: none; }

    @keyframes arrive-unwipe {
      from { clip-path: inset(0 0 0 0 round 6px); }
      to   { clip-path: inset(0 100% 0 0 round 6px); }
    }

    #arrivedBanner .pin { flex-shrink: 0; width: 20px; height: 20px; color: var(--red); }
    #arrivedBanner p { margin: 0; min-width: 0; }
    #arrivedRoomName { font-weight: 700; }

    #arrivedBanner a {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 var(--s3);
      border: 1px solid var(--hairline);
      border-radius: var(--r-btn);
      color: var(--on-bar);
      font-size: var(--fs-sm);
      font-weight: 600;
      white-space: nowrap;
      text-decoration: none;
      transition: background-color .15s var(--ease);
    }

    @media (hover: hover) and (pointer: fine) {
      #arrivedBanner a:hover { background: rgba(255, 255, 255, .1); }
    }

    #arrivedBanner a:focus-visible {
      outline: 2px solid var(--on-bar);
      outline-offset: 2px;
    }

    /* ------------------------------------------------- in-scene waypoint */

    /*
      Street View's grammar: a white chevron lying flat on the floor, pointing
      the way you walk. Tilted back in perspective so it reads as painted on
      the ground, with a dark edge under the white so it holds on a pale tiled
      corridor as well as on dark asphalt. No pulse, no loop.
    */
    .walk-hotspot { width: 0; height: 0; }   /* Pannellum positions this box's corner */

    .hotspot-arrow {
      display: grid;
      place-items: center;
      width: 120px; height: 84px;
      margin: -42px 0 0 -60px;              /* centre the arrow on the point */
      cursor: pointer;
      transform: perspective(260px) rotateX(55deg);
      transition: transform .15s var(--ease);
    }

    .hotspot-arrow svg { width: 104px; height: 65px; overflow: visible; }
    .hotspot-arrow path { stroke-linecap: round; stroke-linejoin: round; }
    .hotspot-arrow .edge { stroke: rgba(0, 0, 0, .45); stroke-width: 15; }
    .hotspot-arrow .face { stroke: var(--white); stroke-width: 10; transition: stroke .15s var(--ease); }

    @media (hover: hover) and (pointer: fine) {
      .hotspot-arrow:hover { transform: perspective(260px) rotateX(55deg) scale(1.12); }
    }

    .hotspot-arrow:active { transform: perspective(260px) rotateX(55deg) scale(.94); }

    .hotspot-arrow:focus-visible { outline: none; }
    .hotspot-arrow:focus-visible .face { stroke: var(--blue-wash); }
    .hotspot-arrow:focus-visible .edge { stroke: var(--blue); }

    /* ------------------------------------------------------ short viewports
       A phone turned landscape for a wider panorama: top chrome, bottom
       controls and the centred banner all get tight together on a ~360-420px
       tall viewport, so trim all three. */
    @media (max-height: 480px) {
      #topBar { height: 52px; }
      #stepLabel { font-size: var(--fs-body); }
      #controls { bottom: var(--s3); }
      .navBtn { min-height: 44px; padding: var(--s2) var(--s4); }
      #arrivedBanner { top: calc(52px + var(--s2)); }
    }

    @media (prefers-reduced-motion: reduce) {
      #arrivedBanner, #arrivedBanner > *, #arrivedBanner.hiding { animation: none; }
      .navBtn:active:not(:disabled) { transform: none; }
      /* Keep the arrow lying on the floor; only the press and hover scale go. */
      .hotspot-arrow:active, .hotspot-arrow:hover { transform: perspective(260px) rotateX(55deg); }
    }

    /* ---------------------------------------------- data speed: toggle + choice

       A weak phone signal can take a long time to pull a full 4096px panorama.
       The choice below lets the visitor ask for lighter photos (served by
       node-image.php?q=low), and the pill in the top bar switches at any time. */

    /* The quality pill and, beside it, "Save offline", which keeps this whole
       route on the phone for use without signal (walkthrough.js). */
    #speedToggle, #saveRoute {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: var(--s2);
      min-height: 36px;
      padding: 0 var(--s3);
      border: 1px solid var(--hairline);
      border-radius: var(--r-chip);
      background: transparent;
      color: var(--on-bar-dim);
      font-family: var(--font);
      font-size: var(--fs-sm);
      font-weight: 600;
      cursor: pointer;
      transition: color .15s var(--ease), border-color .15s var(--ease), background-color .15s var(--ease);
    }
    #saveRoute[hidden] { display: none; }
    #speedToggle svg, #saveRoute svg { width: 16px; height: 16px; flex-shrink: 0; }
    #speedToggle.on, #saveRoute.on { background: var(--blue); border-color: var(--blue); color: var(--white); }
    #speedToggle:focus-visible, #saveRoute:focus-visible { outline: 2px solid var(--on-bar); outline-offset: 2px; }
    #saveRoute[aria-busy="true"] { cursor: progress; }
    #saveRoute .icon-done, #saveRoute.on .icon-save { display: none; }
    #saveRoute.on .icon-done { display: block; }

    @media (hover: hover) and (pointer: fine) {
      #speedToggle:hover, #saveRoute:hover { color: var(--on-bar); border-color: var(--on-bar); }
      #speedToggle.on:hover, #saveRoute.on:hover { color: var(--white); }
    }
    /* Phones: icons only, matching the back link and crest. */
    @media (max-width: 599px) {
      #speedToggleText, #saveRouteText {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap;
      }
      #speedToggle, #saveRoute { padding: 0; width: 36px; justify-content: center; }
    }

    /* The choice shown on arrival, over the whole screen until one is picked. */
    #speedChoice {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--s4);
      background: rgba(10, 10, 10, .92);
    }
    #speedChoice[hidden] { display: none; }

    .speed-card {
      width: 100%;
      max-width: 520px;
      padding: var(--s7) var(--s5);
      border-radius: var(--r-panel);
      background: #1F1F1F;
      color: var(--on-bar);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
      text-align: center;
    }
    .speed-card h1 {
      margin: 0 0 var(--s2);
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 700;
    }
    .speed-sub { margin: 0 0 var(--s5); color: var(--on-bar-dim); font-size: var(--fs-body); }

    .speed-options { display: grid; gap: var(--s3); }
    @media (min-width: 480px) { .speed-options { grid-template-columns: 1fr 1fr; } }

    .speed-opt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--s2);
      padding: var(--s5) var(--s4);
      border: 1px solid var(--hairline);
      border-radius: var(--r-btn);
      background: rgba(255, 255, 255, .04);
      color: var(--on-bar);
      font-family: var(--font);
      text-align: center;
      cursor: pointer;
      transition: border-color .15s var(--ease), background-color .15s var(--ease), transform .12s var(--ease);
    }
    .speed-opt svg { width: 30px; height: 30px; color: var(--blue-wash); }
    .speed-opt-name { font-family: var(--font-display); font-size: var(--fs-h3); font-weight: 700; }
    .speed-opt-desc { font-size: var(--fs-sm); color: var(--on-bar-dim); line-height: 1.4; }
    .speed-rec { display: block; margin-top: var(--s1); color: var(--blue-wash); font-weight: 600; }
    .speed-rec[hidden] { display: none; }
    .speed-opt:focus-visible { outline: 2px solid var(--on-bar); outline-offset: 2px; }

    @media (hover: hover) and (pointer: fine) {
      .speed-opt:hover { border-color: var(--on-bar); background: rgba(255, 255, 255, .08); }
    }
    .speed-opt:active { transform: scale(.98); }

    .speed-foot { margin: var(--s5) 0 0; color: var(--on-bar-dim); font-size: var(--fs-sm); }

    @media (prefers-reduced-motion: reduce) { .speed-opt:active { transform: none; } }
  </style>
</head>

<body>

  <div id="topBar">
    <a id="backLink" href="select-room.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>All rooms</span>
    </a>
    <div id="stepInfo">
      <span id="stepLabel">Loading…</span>
      <span id="stepCount"></span>
    </div>
    <button id="saveRoute" type="button" hidden title="Save this route to use without signal">
      <svg class="icon-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M5 20h14"/></svg>
      <svg class="icon-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>
      <span id="saveRouteText" aria-live="polite">Save offline</span>
    </button>
    <button id="speedToggle" type="button" aria-pressed="false" title="Switch to low-data photos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      <span id="speedToggleText">Fast</span>
    </button>
    <a id="wtCrest" href="../index.html" aria-label="EduTrack home">
      <img src="../assets/img/aclc-logo.jpg" width="30" height="30" alt="">
      <span>EduTrack</span>
    </a>
    <div id="routeProgress" aria-hidden="true"><span></span></div>
  </div>


  <!-- Shown on arrival until the visitor picks a photo quality. walkthrough.js
       keeps it hidden when a choice was made on an earlier visit. -->
  <div id="speedChoice" hidden role="dialog" aria-modal="true" aria-labelledby="speedTitle">
    <div class="speed-card">
      <h1 id="speedTitle">Before you walk</h1>
      <p class="speed-sub">Choose how the 360° photos load.</p>
      <div class="speed-options">
        <button class="speed-opt" type="button" data-quality="fast">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
          <span class="speed-opt-name">Fast Internet</span>
          <span class="speed-opt-desc">Full-quality photos. Best on wifi or a strong signal.</span>
        </button>
        <button class="speed-opt" type="button" data-quality="low">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20a8 8 0 1 0-8-8"/><path d="M4 12H2m4.3-5.7L4.9 4.9M12 6V4"/><path d="m12 12 3 2"/></svg>
          <span class="speed-opt-name">Low Internet</span>
          <span class="speed-opt-desc">Lighter photos that load faster and use less data.
            <span class="speed-rec" hidden>Recommended for your connection</span></span>
        </button>
      </div>
      <p class="speed-foot">You can switch anytime from the top bar.</p>
    </div>
  </div>

  <div id="panorama"></div>

  <div id="controls">
    <button class="navBtn" id="prevBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      Back
    </button>
    <button class="navBtn primary" id="nextBtn">
      Next
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <p id="walkHint" aria-hidden="true">Tap the arrow to walk. Drag to look around.</p>


  <div id="arrivedBanner" role="status">
    <svg class="pin" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a8 8 0 0 0-8 8c0 6 8 12 8 12s8-6 8-12a8 8 0 0 0-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
    <p>You've arrived at <span id="arrivedRoomName"></span></p>
    <a id="otherRoomsLink" href="select-room.html">Other rooms</a>
  </div>


  <script src="../assets/js/offline.js?v=2"></script>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <script src="walkthrough.js?v=15"></script>
</body>

</html>
