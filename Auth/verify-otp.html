<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack - Confirm your email</title>
<meta name="description" content="Enter the 6-digit code sent to your email to confirm your EduTrack account.">
<meta name="theme-color" content="#0044d6">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<style>
  /* A long address should wrap inside the lede rather than widen it. */
  #subtitleText { overflow-wrap: anywhere; }
</style>
</head>
<body>

  <a class="skip-link" href="#main">Skip to the form</a>

  <header class="brand">
    <a class="brand-link" href="../index.html" aria-label="EduTrack home">
      <img class="brand-seal" src="../assets/img/aclc-logo.jpg" width="56" height="56" alt="">
      <span class="brand-text">
        <span class="brand-mark">EduTrack</span>
        <span class="brand-sub">ACLC College, Mandaue Campus</span>
      </span>
    </a>
  </header>
  <main class="page fade-in" id="main">
    <div class="auth-form">
      <a class="back-link" href="register.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Change email</a>

      <ol class="steps">
        <li class="is-done"><span class="visually-hidden">Step 1 of 2, done: </span>Your details</li>
        <li aria-current="step"><span class="visually-hidden">Step 2 of 2: </span>Confirm your email</li>
      </ol>

      <h1 class="page-title">Confirm your email</h1>
      <p class="page-lede" id="subtitleText">Enter the 6-digit code we sent you.</p>

      <div id="alertBox" class="alert" role="alert"></div>

      <form id="otpForm" class="form" novalidate>
        <div class="otp-inputs" role="group" aria-label="6-digit code">
          <input type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code" class="otp-digit" aria-label="Digit 1">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" aria-label="Digit 2">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" aria-label="Digit 3">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" aria-label="Digit 4">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" aria-label="Digit 5">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" aria-label="Digit 6">
        </div>
        <div class="field-error" id="err-otp">That code doesn't look right.</div>

        <button type="submit" class="btn" id="submitBtn">Verify</button>
      </form>

      <p class="form-footer">Didn't get a code? <button type="button" class="link-button" id="resendLink">Send it again</button></p>
    </div>
  </main>

<script src="auth.js"></script>
<script src="verify-otp.js?v=1"></script>
</body>
</html>
