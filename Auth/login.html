<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack — Log In</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  body {
    background-image: linear-gradient(rgba(21,24,29,0.62), rgba(21,24,29,0.62)), url('../assets/img/campus-bg.webp');
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  .card {
    background: rgba(27,30,37,0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .back-btn {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 18px;
    background: rgba(27,30,37,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 999px;
    color: var(--text); text-decoration: none; font-size: 0.95rem; font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .back-btn:hover { background: rgba(27,30,37,0.98); border-color: var(--accent); }
  .back-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
</style>
</head>
<body>
  <a href="../index.html" class="back-btn" aria-label="Back to home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back
  </a>
  <div class="page-center">
    <div class="card">
      <h1>Log in</h1>
      <p class="subtitle">Enter your student account details.</p>

      <div id="alertBox" class="alert"></div>

      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" inputmode="email">
        <div class="field-error" id="err-email">Enter the email you registered with.</div>

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password">
        <div class="field-error" id="err-password">Enter your password.</div>

        <button type="submit" class="btn" id="submitBtn">Log In</button>
      </form>

      <div class="form-footer">
        No account yet? <a href="register.html">Register</a>
      </div>
    </div>
  </div>

<script src="auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearErrors();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    let valid = true;
    if (!email) { showError('email'); valid = false; }
    if (!password) { showError('password'); valid = false; }
    if (!valid) return;

    setSubmitting(true);
    apiPost('login.php', { email, password })
      .then(({ data }) => {
        setSubmitting(false);
        if (!data.ok) {
          showAlert(data.error || 'Login failed.', 'error');
          return;
        }
        window.location.href = '../map/select-room.html';
      })
      .catch(() => {
        setSubmitting(false);
        showAlert('Could not reach server. Try again.', 'error');
      });
  });

  function setSubmitting(state) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = state;
    btn.textContent = state ? 'Logging in…' : 'Log In';
  }
</script>
</body>
</html>
