<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack - Log in</title>
<meta name="description" content="Log in to your EduTrack student account at ACLC College Mandaue.">
<meta name="theme-color" content="#0044d6">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
</head>
<body>

  <a class="skip-link" href="#main">Skip to the form</a>

  <header class="brand">
    <a class="brand-link" href="../index.html" aria-label="EduTrack home">
      <img class="brand-seal" src="../assets/img/aclc-logo.jpg" width="56" height="56" alt="">
      <span class="brand-text">
        <span class="brand-mark">EduTrack</span>
        <span class="brand-sub">ACLC College, Mandaue Campus</span>
      </span>
    </a>
  </header>
  <main class="page auth auth-solo fade-in" id="main">
    <div class="auth-form">
      <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Home</a>
      <h1 class="page-title">Log in</h1>
      <p class="page-lede">Use the email and password you registered with.</p>

      <div id="alertBox" class="alert" role="alert"></div>

      <form id="loginForm" class="form" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
        <div class="field-error" id="err-email">Enter the email you registered with.</div>

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Your password">
        <div class="field-error" id="err-password">Enter your password.</div>

        <button type="submit" class="btn" id="submitBtn">Log in</button>
      </form>

      <p class="form-footer">No account yet? <a href="register.html">Create one</a></p>
    </div>
  </main>

<script src="auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearErrors();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    let valid = true;
    if (!email) { showError('email'); valid = false; }
    if (!password) { showError('password'); valid = false; }
    if (!valid) return;

    setSubmitting(true);
    apiPost('login.php', { email, password })
      .then(({ data }) => {
        setSubmitting(false);
        if (!data.ok) {
          showAlert(data.error || 'Login failed.', 'error');
          return;
        }
        // Older accounts have no enrolment numbers; the tour would refuse them.
        window.location.href = data.needsDetails ? 'add-details.html' : 'student-home.html';
      })
      .catch(() => {
        setSubmitting(false);
        showAlert('Could not reach server. Try again.', 'error');
      });
  });

  function setSubmitting(state) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = state;
    btn.textContent = state ? 'Logging in…' : 'Log in';
  }
</script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=a0930fcf-cc94-4509-8d01-b26d3fbb5a23"></script>
<!-- impeccable-live-end -->
</body>
</html>
