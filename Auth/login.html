<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack — Log In</title>
<meta name="description" content="Log in to your EduTrack student account at ACLC College Mandaue.">
<meta name="theme-color" content="#0033a0">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to the form</a>

  <div class="shell">

    <header class="identity" aria-label="EduTrack, ACLC College Mandaue Campus">
      <div class="identity-main">
        <img class="identity-logo" src="../assets/img/aclc-logo.jpg" width="192" height="192" alt="ACLC College &mdash; Mandaue Campus">
        <h1 class="identity-mark">EduTrack</h1>
        <p class="identity-tagline">Campus map &amp; <span class="nowrap">room-to-room</span> walkthrough</p>
      </div>
      <p class="locality">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        ACLC College &mdash; Mandaue Campus
      </p>
    </header>

    <main class="surface" id="main" aria-label="Main content">
      <div class="surface-inner is-narrow fade-in">

        <a href="../index.html" class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back to home
        </a>

        <h2 class="surface-title">Log in</h2>
        <p class="surface-lede">Enter your student account details.</p>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm" class="surface-form" novalidate>
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="Enter your email">
          <div class="field-error" id="err-email">Enter the email you registered with.</div>

          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password">
          <div class="field-error" id="err-password">Enter your password.</div>

          <button type="submit" class="btn" id="submitBtn">Log In</button>
        </form>

        <div class="form-footer">
          No account yet? <a href="register.html">Register</a>
        </div>

      </div>
    </main>

  </div>

<script src="auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearErrors();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    let valid = true;
    if (!email) { showError('email'); valid = false; }
    if (!password) { showError('password'); valid = false; }
    if (!valid) return;

    setSubmitting(true);
    apiPost('login.php', { email, password })
      .then(({ data }) => {
        setSubmitting(false);
        if (!data.ok) {
          showAlert(data.error || 'Login failed.', 'error');
          return;
        }
        window.location.href = '../map/select-room.html';
      })
      .catch(() => {
        setSubmitting(false);
        showAlert('Could not reach server. Try again.', 'error');
      });
  });

  function setSubmitting(state) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = state;
    btn.textContent = state ? 'Logging in…' : 'Log In';
  }
</script>
</body>
</html>
