<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack — Log In</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  body {
    background-image: linear-gradient(rgba(21,24,29,0.62), rgba(21,24,29,0.62)), url('../assets/img/campus-bg.webp');
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  .card {
    background: rgba(27,30,37,0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  /*
    The card and its way out share one column. Pinned to the viewport corner
    the link drifted further from the card the wider the screen got, until on
    a desktop it read as a stray chip on the photograph rather than as this
    card's own way back. In the flow it stays where the eye already is.
  */
  .auth-stack {
    width: 100%; max-width: 420px;
    display: flex; flex-direction: column; gap: 14px;
  }

  .back-btn {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 16px;
    /* Enough plate to stay legible on the photograph, without the drop shadow
       it needed while it was floating above the page. */
    background: rgba(27,30,37,0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    /* 6px, matching the inputs below it. The 999px pill was the one
       rounded-full control in a system whose own rules reject them. */
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); text-decoration: none; font-size: 0.9rem; font-weight: 600;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
  }

  /* Gated: on a touch screen an ungated :hover sticks after the tap, leaving
     the button looking permanently hovered. */
  @media (hover: hover) and (pointer: fine) {
    .back-btn:hover { background: rgba(27,30,37,0.92); border-color: var(--accent); }
    /* The index directory nudges its arrow 3px right on hover to mean
       "onward". The same 3px the other way is what going back looks like. */
    .back-btn:hover svg { transform: translateX(-3px); }
  }

  /* The button spec every other control in the system already follows:
     press feedback, and a focus ring a keyboard user can actually find. */
  .back-btn:active { transform: scale(0.98); }
  .back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .back-btn, .back-btn svg { transition: background 0.15s ease, border-color 0.15s ease; }
    .back-btn:active { transform: none; }
    .back-btn:hover svg { transform: none; }
  }

  .back-btn svg {
    width: 18px; height: 18px; flex-shrink: 0;
    transition: transform 0.15s ease;
  }
</style>
</head>
<body>
  <div class="page-center">
    <div class="auth-stack">
      <a href="../index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to home
      </a>
    <div class="card">
      <h1>Log in</h1>
      <p class="subtitle">Enter your student account details.</p>

      <div id="alertBox" class="alert"></div>

      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" inputmode="email">
        <div class="field-error" id="err-email">Enter the email you registered with.</div>

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password">
        <div class="field-error" id="err-password">Enter your password.</div>

        <button type="submit" class="btn" id="submitBtn">Log In</button>
      </form>

      <div class="form-footer">
        No account yet? <a href="register.html">Register</a>
      </div>
    </div>
    </div>
  </div>

<script src="auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearErrors();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    let valid = true;
    if (!email) { showError('email'); valid = false; }
    if (!password) { showError('password'); valid = false; }
    if (!valid) return;

    setSubmitting(true);
    apiPost('login.php', { email, password })
      .then(({ data }) => {
        setSubmitting(false);
        if (!data.ok) {
          showAlert(data.error || 'Login failed.', 'error');
          return;
        }
        window.location.href = '../map/select-room.html';
      })
      .catch(() => {
        setSubmitting(false);
        showAlert('Could not reach server. Try again.', 'error');
      });
  });

  function setSubmitting(state) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = state;
    btn.textContent = state ? 'Logging in…' : 'Log In';
  }
</script>
</body>
</html>
