<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack - Add your enrolment details</title>
<meta name="description" content="Add your student ID number and study load number to open the EduTrack room tour.">
<meta name="theme-color" content="#0044d6">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
</head>
<body>

  <a class="skip-link" href="#main">Skip to the form</a>

  <header class="brand">
    <a class="brand-link" href="../index.html" aria-label="EduTrack home">
      <img class="brand-seal" src="../assets/img/aclc-logo.jpg" width="56" height="56" alt="">
      <span class="brand-text">
        <span class="brand-mark">EduTrack</span>
        <span class="brand-sub">ACLC College, Mandaue Campus</span>
      </span>
    </a>
  </header>
  <main class="page auth auth-solo fade-in" id="main">
    <div class="auth-form">
      <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Home</a>
      <h1 class="page-title">One more step</h1>
      <p class="page-lede">The room tour is for enrolled students. Your account was made before we asked for these, so add them once and you're in.</p>

      <div id="alertBox" class="alert" role="alert"></div>

      <form id="detailsForm" class="form" novalidate>
        <label for="studentNo">Student ID number</label>
        <input type="text" id="studentNo" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20" placeholder="As printed on your school ID">
        <div class="field-error" id="err-studentNo">Enter your student ID number.</div>

        <label for="studyLoadNo">Study load number</label>
        <input type="text" id="studyLoadNo" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="30" placeholder="As printed on your study load">
        <div class="field-error" id="err-studyLoadNo">Enter your study load number.</div>

        <button type="submit" class="btn" id="submitBtn">Open the room tour</button>
      </form>
    </div>

  </main>

<script src="../assets/js/offline.js?v=3"></script>
<script src="auth.js"></script>
<script src="add-details.js?v=1"></script>
</body>
</html>
