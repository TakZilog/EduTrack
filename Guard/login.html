<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack — Guard Login</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="page-center">
    <div class="card">
      <h1>Guard Login</h1>
      <p class="subtitle">Enter the guard password to issue registration codes.</p>

      <div id="alertBox" class="alert"></div>

      <form id="guardLoginForm" novalidate>
        <!--
          The element id and the JSON field sent to api/guard-login.php are
          still called "passphrase". Only the wording on screen changed, so
          the two sides stay wired together.
        -->
        <label for="passphrase">Password</label>
        <input type="password" id="passphrase" autocomplete="off">
        <div class="field-error" id="err-passphrase">Enter the guard password.</div>

        <button type="submit" class="btn" id="submitBtn">Log In</button>
      </form>
    </div>
  </div>

<script src="../Auth/auth.js"></script>
<script>
  document.getElementById('guardLoginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearErrors();

    const passphrase = document.getElementById('passphrase').value;
    if (!passphrase) {
      showFieldErrorById('err-passphrase');
      return;
    }

    setSubmitting(true);
    apiPost('guard-login.php', { passphrase })
      .then(({ data }) => {
        setSubmitting(false);
        if (!data.ok) {
          showAlert(data.error || 'Login failed.', 'error');
          return;
        }
        window.location.href = 'issue-code.html';
      })
      .catch(() => {
        setSubmitting(false);
        showAlert('Could not reach server. Try again.', 'error');
      });
  });

  function setSubmitting(state) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = state;
    btn.textContent = state ? 'Logging in…' : 'Log In';
  }
</script>
</body>
</html>
