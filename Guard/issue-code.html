<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack — Guard: Issue Code</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  .card { text-align:center; }

  .badge-icon {
    width:52px; height:52px; margin:0 auto 18px; border-radius:50%;
    background:var(--accent); display:flex; align-items:center; justify-content:center;
  }

  .btn { touch-action:manipulation; }

  #codeDisplay .btn-secondary { margin-top:16px; }
</style>
</head>
<body>
  <div class="page-center">
    <div class="card">
      <div class="badge-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 3l7 3v5c0 4.5-3 8.2-7 9.5-4-1.3-7-5-7-9.5V6l7-3z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1>Issue Registration Code</h1>
      <p class="subtitle">Generate a one-time code for the student to register with.</p>

      <div id="alertBox" class="alert"></div>

      <button type="button" class="btn" id="generateBtn">Generate Code</button>

      <div class="code-display" id="codeDisplay" style="display:none;">
        <div class="code" id="generatedCode">------</div>
        <div class="code-note">Give this code to the student now. It can only be used once and expires in 1 hour.</div>
        <button type="button" class="btn btn-secondary" id="generateAnotherBtn">Generate Another</button>
      </div>
    </div>
  </div>

<script src="../auth/auth.js"></script>
<script>
  const generateBtn = document.getElementById('generateBtn');
  const generateAnotherBtn = document.getElementById('generateAnotherBtn');
  const codeDisplay = document.getElementById('codeDisplay');

  const COOLDOWN_SECONDS = 5;

  function startCooldown(btn, label) {
    let remaining = COOLDOWN_SECONDS;
    btn.disabled = true;
    btn.textContent = `Wait ${remaining}s…`;
    const timer = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = label;
      } else {
        btn.textContent = `Wait ${remaining}s…`;
      }
    }, 1000);
  }

  function generateCode(btn) {
    clearErrors();
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Generating…';

    fetch('../api/issue-code.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    })
      .then(res => {
        if (res.status === 401) {
          window.location.href = 'login.html';
          return null;
        }
        return res.json();
      })
      .then(data => {
        if (!data) return;
        if (!data.ok) {
          btn.disabled = false;
          btn.textContent = originalText;
          showAlert(data.error || 'Failed to generate code.', 'error');
          return;
        }
        document.getElementById('generatedCode').textContent = data.code;
        generateBtn.style.display = 'none';
        codeDisplay.style.display = 'block';
        showAlert('Code generated.', 'success');
        startCooldown(generateAnotherBtn, 'Generate Another');
      })
      .catch(() => {
        btn.disabled = false;
        btn.textContent = originalText;
        showAlert('Could not reach server. Try again.', 'error');
      });
  }

  generateBtn.addEventListener('click', () => generateCode(generateBtn));
  generateAnotherBtn.addEventListener('click', () => generateCode(generateAnotherBtn));
</script>
</body>
</html>
