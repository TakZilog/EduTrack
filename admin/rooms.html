<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack Staff Panel - Rooms</title>
<meta name="theme-color" content="#0044d6">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<link rel="stylesheet" href="../assets/css/admin.css?v=6">
<meta name="robots" content="noindex">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <aside class="rail" id="rail"></aside>

  <main class="work" id="main">
    <div class="work-head">
      <h1>Rooms</h1>
      <p class="work-lede">Every room a visitor can walk to from the gate. Choose a room to see its walk, photo by photo.</p>
    </div>

    <div class="work-body">
      <div class="counts" id="summary"></div>

      <section class="panel">
        <div class="panel-head"><h2>Problems with the map</h2></div>
        <div class="panel-body">
          <div id="problems"></div>
          <p class="field-hint">
            The map is built from photographs and is edited outside this panel. This screen tells you
            what is wrong so it can be fixed at the source.
          </p>
        </div>
      </section>

      <div class="toolbar">
        <div class="search">
          <label class="sr-only" for="q">Search rooms</label>
          <input type="search" id="q" placeholder="Search rooms, for example 101 or Clinic">
        </div>
        <div>
          <label class="sr-only" for="floor">Floor</label>
          <select id="floor"><option value="">Every floor</option></select>
        </div>
      </div>

      <div class="desk">
        <section class="panel" aria-labelledby="listTitle">
          <div class="panel-head"><h2 id="listTitle">Rooms on the map</h2></div>
          <ul class="rows" id="rows"></ul>
        </section>

        <section class="drawer" id="drawer" aria-live="polite"
                 data-empty-title="No room open"
                 data-empty-text="Choose a room on the left to see its walk and its details."></section>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/admin/admin.js?v=6"></script>
<script>
(async function () {
  const s = await boot();
  if (!s) return;

  const rows = document.getElementById('rows');
  const drawer = document.getElementById('drawer');
  const floorSelect = document.getElementById('floor');

  let all = [];          // rooms visitors can choose
  let unlisted = [];     // photos on the map that are not offered to visitors
  let floors = [];
  const state = { q: '', floor: '', openName: null };

  async function load() {
    showSkeleton(rows, 8);

    const { data } = await apiGet('rooms.php');
    if (!data.ok) {
      toast(data.error || 'Could not load the rooms.', 'bad');
      return;
    }

    all = data.rooms;
    unlisted = (data.unlisted || []).map(u => ({ ...u, isUnlisted: true }));
    floors = data.floors.filter(Boolean);

    drawSummary(data);
    drawProblems(data);
    fillFloorFilter();
    paint();
  }

  function drawSummary(data) {
    const summary = document.getElementById('summary');
    summary.replaceChildren();
    const unreachable = all.filter(r => !r.reachable).length;

    [
      { n: data.summary.rooms,  l: 'Rooms on the map', tone: 'is-quiet' },
      { n: data.summary.photos, l: 'Photos in the walkthrough', tone: 'is-quiet' },
      { n: unreachable, l: 'Rooms visitors cannot reach', tone: unreachable > 0 ? 'is-bad' : '' },
      { n: data.problems.length, l: 'Problems found', tone: data.problems.length > 0 ? 'is-bad' : '' }
    ].forEach(c => {
      const div = document.createElement('div');
      div.className = 'count-card';
      const n = document.createElement('span');
      n.className = 'count-n' + (c.tone ? ' ' + c.tone : '');
      n.textContent = c.n;
      const l = document.createElement('span');
      l.className = 'count-l';
      l.textContent = c.l;
      div.append(n, l);
      summary.appendChild(div);
    });
  }

  function drawProblems(data) {
    const problems = document.getElementById('problems');
    problems.replaceChildren();

    if (data.problems.length === 0) {
      problems.appendChild(notice('good', 'No problems found',
        'Every room can be reached and every photo is in place.'));
      return;
    }
    data.problems.forEach(p => {
      problems.appendChild(notice(p.severity === 'error' ? 'error' : 'warning', p.title, p.detail));
    });
  }

  function notice(kind, title, detail) {
    const el = document.createElement('div');
    el.className = 'notice notice-' + kind;
    const t = document.createElement('p');
    t.className = 't';
    t.textContent = title;
    const d = document.createElement('p');
    d.className = 'd';
    d.textContent = detail;
    el.append(t, d);
    return el;
  }

  function fillFloorFilter() {
    const chosen = floorSelect.value;
    floorSelect.replaceChildren();
    const every = document.createElement('option');
    every.value = '';
    every.textContent = 'Every floor';
    floorSelect.appendChild(every);
    floors.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f;
      opt.textContent = f;
      floorSelect.appendChild(opt);
    });
    if (floors.includes(chosen)) floorSelect.value = chosen;
  }

  floorSelect.addEventListener('change', e => { state.floor = e.target.value; paint(); });

  document.getElementById('q').addEventListener('input', debounce(e => {
    state.q = e.target.value.trim().toLowerCase();
    paint();
  }, 250));

  /* Rooms visitors can choose come first; photos that are on the map but not
     offered to anyone follow, marked, so both live in one list. */
  function paint() {
    const listed = all.filter(r =>
      (state.q === '' || r.name.toLowerCase().includes(state.q)) &&
      (state.floor === '' || r.floor === state.floor)
    );
    const hidden = state.floor !== '' ? [] : unlisted.filter(u =>
      state.q === '' || (u.label || u.nodeId).toLowerCase().includes(state.q)
    );

    if (listed.length === 0 && hidden.length === 0) {
      showEmpty(rows, 'No rooms match',
        'Nothing here fits what you searched for.',
        'Show every room',
        () => {
          state.q = ''; state.floor = '';
          document.getElementById('q').value = '';
          floorSelect.value = '';
          paint();
        });
      return;
    }

    rows.replaceChildren();

    listed.forEach(room => {
      const end = [];
      if (!room.reachable) end.push(pill('No route', 'revoked'));
      if (room.steps) {
        const steps = document.createElement('span');
        steps.className = 'row-when';
        steps.textContent = room.steps + ' steps';
        end.push(steps);
      }

      rows.appendChild(listRow({
        title: room.name,
        sub: room.floor,
        end,
        selected: state.openName === room.name,
        onOpen: row => { markOpenRow(rows, row); openRoom(room); }
      }));
    });

    hidden.forEach(item => {
      rows.appendChild(listRow({
        title: item.label || item.nodeId,
        sub: 'Not shown to visitors',
        end: [pill(item.reachable ? 'Not listed' : 'No route', item.reachable ? 'off' : 'revoked')],
        selected: state.openName === item.nodeId,
        onOpen: row => { markOpenRow(rows, row); openUnlisted(item); }
      }));
    });
  }

  /* ------------------------------------------------------------- a room */

  function openRoom(room) {
    state.openName = room.name;

    const actions = [];

    actions.push(button('Show the walk', 'btn', () => showRoute(room)));

    if (room.reachable) {
      const open = document.createElement('a');
      open.className = 'btn btn-quiet';
      open.href = '../map/walkthrough.html?room=' + encodeURIComponent(room.name);
      open.target = '_blank';
      open.rel = 'noopener';
      open.textContent = 'Open in the viewer';
      actions.push(open);
    }

    if (allowed('room.edit')) {
      actions.push(button('Edit name and floor', 'btn-quiet', () => editRoom(room)));
      actions.push(button('Remove from the list', 'btn-danger', () => removeRoom(room)));
    }

    drawDrawer(drawer, {
      title: room.name,
      sub: room.floor,
      body: facts([
        ['Floor', room.floor],
        ['Can visitors reach it', room.reachable ? pill('Yes', 'verified') : pill('No route', 'revoked')],
        ['Steps from the gate', room.steps ? String(room.steps) : '—']
      ]),
      actions
    });
  }

  function openUnlisted(item) {
    state.openName = item.nodeId;

    const id = document.createElement('span');
    id.className = 'mono';
    id.textContent = item.nodeId;

    const actions = [];
    if (allowed('room.edit')) {
      actions.push(button('Put back on the list', 'btn', () => relist(item)));
    }

    drawDrawer(drawer, {
      title: item.label || item.nodeId,
      sub: 'This photo is on the map, but visitors are not offered it.',
      body: facts([
        ['Photo', id],
        ['Can visitors reach it', item.reachable ? pill('Yes', 'verified') : pill('No route', 'revoked')]
      ]),
      actions
    });
  }

  /*
    The walk, as pictures, inside the drawer. This is the answer to "which
    photo is which part of the building": nobody reads a node id, they look at
    the corridor and see where it leads.
  */
  async function showRoute(room) {
    const loading = document.createElement('p');
    loading.textContent = 'Loading the walk…';
    drawDrawer(drawer, {
      title: room.name,
      sub: 'The walk from the gate',
      body: loading,
      actions: [button('Back to the room', 'btn-quiet', () => openRoom(room))]
    });

    const { data } = await apiGet('room-route.php', { name: room.name });

    if (!data.ok || !data.reachable) {
      drawDrawer(drawer, {
        title: room.name,
        sub: 'The walk from the gate',
        body: notice('error', 'No walk to show', data.ok ? data.why : (data.error || 'Could not load the walk.')),
        actions: [button('Back to the room', 'btn-quiet', () => openRoom(room))]
      });
      return;
    }

    const intro = document.createElement('p');
    intro.className = 'field-hint';
    intro.style.marginTop = '0';
    intro.textContent = 'From the gate to the door, ' + data.total
      + ' photos. This is exactly what a visitor sees, in order.';

    const strip = document.createElement('ul');
    strip.className = 'walk';

    data.steps.forEach(step => {
      const li = document.createElement('li');
      li.className = 'walk-step';
      li.dataset.last = String(step.isLast);

      const img = document.createElement('img');
      img.src = '../api/admin/thumb.php?node=' + encodeURIComponent(step.nodeId);
      img.loading = 'lazy';
      img.alt = 'Photo at step ' + step.position + ': ' + step.title;

      const text = document.createElement('div');

      const n = document.createElement('div');
      n.className = 'n';
      n.textContent = 'Step ' + step.position + ' of ' + data.total;

      const t = document.createElement('div');
      t.className = 't';
      t.textContent = step.title;

      const d = document.createElement('p');
      d.className = 'd';
      if (step.isLast) {
        d.textContent = 'The door. This is where the walk ends.';
      } else if (step.shared > 6) {
        // Naming forty rooms helps nobody; the count is the useful fact.
        d.textContent = 'A main corridor. ' + step.shared + ' rooms are reached through here.';
      } else if (step.shared > 0) {
        d.textContent = 'On the way to ' + step.leadsTo.join(', ') + '.';
      } else {
        d.textContent = 'Leads only to this room.';
      }

      text.append(n, t, d);

      // Replacing is offered next to the picture itself. You choose the photo
      // by looking at it, never by knowing what a node id is.
      if (allowed('room.edit')) {
        const swap = button('Replace this photo', 'btn-quiet btn-small', () => replacePhoto(step, img, text));
        swap.style.marginTop = 'var(--s2)';
        text.appendChild(swap);
      }

      li.append(img, text);
      strip.appendChild(li);
    });

    drawDrawer(drawer, {
      title: room.name,
      sub: 'The walk from the gate',
      body: [intro, strip],
      actions: [button('Back to the room', 'btn-quiet', () => openRoom(room))]
    });
  }

  /*
    One photo, swapped in place. The route does not change, so this cannot
    strand a room or break a link. The old picture is kept on the server.
  */
  function replacePhoto(step, imgEl, host) {
    const picker = document.createElement('input');
    picker.type = 'file';
    picker.accept = 'image/jpeg,image/png,image/webp';

    picker.addEventListener('change', async () => {
      const file = picker.files[0];
      if (!file) return;

      const yes = await confirmAction({
        title: 'Replace the photo at step ' + step.position + '?',
        message: 'Visitors will see this new picture at "' + step.title + '". '
          + 'It must be a 360 photo, twice as wide as it is tall. '
          + 'The old picture is kept on the server, so this can be undone.',
        confirmLabel: 'Yes, replace it'
      });
      if (!yes) return;

      const note = document.createElement('p');
      note.className = 'd';
      note.textContent = 'Uploading…';
      host.appendChild(note);

      const form = new FormData();
      form.append('node', step.nodeId);
      form.append('photo', file);

      let data;
      try {
        const res = await fetch('../api/admin/photo-replace.php', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'X-CSRF-Token': csrfToken },
          body: form   // no Content-Type: the browser sets the multipart boundary
        });
        data = await res.json();
      } catch {
        data = { ok: false, error: 'Could not reach the server. Please try again.' };
      }

      note.remove();

      if (!data.ok) {
        toast(data.error, 'bad');
        return;
      }

      toast(data.message + ' Now ' + data.width + ' by ' + data.height + ', ' + data.sizeKb + ' KB.');
      // Cache-bust so the new picture shows immediately.
      imgEl.src = '../api/admin/thumb.php?node=' + encodeURIComponent(step.nodeId) + '&v=' + Date.now();
    });

    picker.click();
  }

  /* ------------------------------------------------------- edit and relist */

  /*
    Only the name and the floor. The route and the photos are not editable
    here on purpose: which photo leads to which is worked out by comparing the
    images, so it is changed by walking the building again, not by typing.
  */
  function editRoom(room) {
    askFor({
      title: 'Edit room details',
      message: 'This changes what visitors see in the room list. The photos and the walking route are not affected.',
      nameLabel: 'Room name',
      nameValue: room.name,
      nameHint: 'Every room needs a different name. Two rooms with the same name means only one of them can be reached.',
      floorValue: room.floor,
      confirmLabel: 'Save',
      onSave: (newName, floor) => apiPost('room-action.php', {
        action: 'rename', name: room.name, newName, floor
      })
    });
  }

  function relist(item) {
    askFor({
      title: 'Put this room back on the list',
      message: 'Visitors will be able to choose it again. Give it the name and floor they should see.',
      nameLabel: 'Room name',
      nameValue: item.label || '',
      floorValue: floors[0],
      confirmLabel: 'Put it back',
      onSave: (newName, floor) => apiPost('room-action.php', {
        action: 'relist', nodeId: item.nodeId, newName, floor
      })
    });
  }

  /* One small form, asked in a dialog because it must be answered or
     abandoned before the list behind it changes. */
  function askFor({ title, message, nameLabel, nameValue, nameHint, floorValue, confirmLabel, onSave }) {
    const dialog = document.createElement('dialog');

    const body = document.createElement('div');
    body.className = 'dialog-body';

    const h = document.createElement('h2');
    h.textContent = title;
    const p = document.createElement('p');
    p.textContent = message;
    body.append(h, p);

    const nameField = document.createElement('div');
    nameField.className = 'field';
    const nameLab = document.createElement('label');
    nameLab.setAttribute('for', 'roomName');
    nameLab.textContent = nameLabel;
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.id = 'roomName';
    nameInput.maxLength = 100;
    nameInput.value = nameValue;
    nameField.append(nameLab, nameInput);
    if (nameHint) {
      const hint = document.createElement('p');
      hint.className = 'field-hint';
      hint.textContent = nameHint;
      nameField.appendChild(hint);
    }

    const floorField = document.createElement('div');
    floorField.className = 'field';
    const floorLab = document.createElement('label');
    floorLab.setAttribute('for', 'roomFloor');
    floorLab.textContent = 'Floor';
    const floorInput = document.createElement('select');
    floorInput.id = 'roomFloor';
    floors.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f;
      opt.textContent = f;
      if (f === floorValue) opt.selected = true;
      floorInput.appendChild(opt);
    });
    floorField.append(floorLab, floorInput);

    const error = document.createElement('p');
    error.className = 'field-error';
    body.append(nameField, floorField, error);

    const foot = document.createElement('div');
    foot.className = 'dialog-foot';
    const cancel = document.createElement('button');
    cancel.className = 'btn btn-quiet';
    cancel.type = 'button';
    cancel.textContent = 'Cancel';
    const save = document.createElement('button');
    save.className = 'btn';
    save.type = 'button';
    save.textContent = confirmLabel;
    foot.append(cancel, save);

    dialog.append(body, foot);
    document.body.appendChild(dialog);

    const shut = () => { dialog.close(); dialog.remove(); };
    cancel.addEventListener('click', shut);
    dialog.addEventListener('cancel', e => { e.preventDefault(); shut(); });

    save.addEventListener('click', async () => {
      error.classList.remove('on');
      save.disabled = true;
      save.textContent = 'Saving…';

      const { data } = await onSave(nameInput.value.trim(), floorInput.value);

      save.disabled = false;
      save.textContent = confirmLabel;

      if (!data.ok) {
        error.textContent = data.error;
        error.classList.add('on');
        return;
      }
      shut();
      toast(data.message);
      state.openName = nameInput.value.trim();
      load();
    });

    dialog.showModal();
    nameInput.focus();
    nameInput.select();
  }

  async function removeRoom(room) {
    const yes = await confirmAction({
      title: 'Remove this room from the list?',
      message: '"' + room.name + '" will no longer be offered to visitors. The photos and the route are kept, so it can be put back later.',
      confirmLabel: 'Yes, remove it',
      danger: true
    });
    if (!yes) return;

    const { data } = await apiPost('room-action.php', { action: 'remove', name: room.name });
    if (!data.ok) { toast(data.error, 'bad'); return; }
    toast(data.message);
    state.openName = null;
    drawDrawer(drawer, null);
    load();
  }

  drawDrawer(drawer, null);
  await load();
})();
</script>
