<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack Staff Panel - Locations</title>
<meta name="theme-color" content="#1A73E8">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<link rel="stylesheet" href="../assets/css/admin.css?v=11">
<meta name="robots" content="noindex">
</head>
<body class="rooms-page">
<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <aside class="rail" id="rail"></aside>

  <main class="work" id="main">
    <div class="work-head rooms-head">
      <div>
        <h1>Locations</h1>
        <p class="work-lede">Manage campus locations available in EduTrack and maintain their location information.</p>
      </div>
      <button class="btn rooms-register" id="registerRoom" type="button">+ Register Location</button>
    </div>

    <div class="work-body">
      <div class="toolbar room-filters">
        <div class="search room-search">
          <label class="sr-only" for="q">Search locations</label>
          <input type="search" id="q" placeholder="Search locations...">
        </div>
        <div>
          <label class="sr-only" for="floor">Floor</label>
          <select id="floor"><option value="">Floor</option></select>
        </div>
        <div>
          <label class="sr-only" for="type">Type</label>
          <select id="type"><option value="">Type</option><option value="room">Room</option></select>
        </div>
        <div>
          <label class="sr-only" for="status">Status</label>
          <select id="status"><option value="">All</option><option value="reachable">Reachable</option><option value="attention">Needs attention</option><option value="unreachable">Unreachable</option></select>
        </div>
      </div>

      <div class="desk room-desk">
        <section class="panel room-list-panel" aria-labelledby="listTitle">
          <div class="panel-head"><h2 id="listTitle">Mapped Locations</h2></div>
          <ul class="rows" id="rows"></ul>
          <div class="room-list-footer" id="roomListFooter"></div>
        </section>

        <section class="drawer" id="drawer" aria-live="polite"
           data-empty-title="No location selected"
           data-empty-text="Select a location to view its information, route, and walkthrough."></section>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/admin/admin.js?v=11"></script>
<script src="rooms.js?v=1"></script>
</body>
</html>
