<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack Staff Panel - Sign in</title>
<meta name="theme-color" content="#0044d6">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<link rel="stylesheet" href="../assets/css/admin.css?v=11">
<meta name="robots" content="noindex">
</head>
<body>

  <main class="signin-wrap">
    <div class="signin">
      <div class="signin-crest">
        <img src="../assets/img/aclc-logo.jpg" width="56" height="56" alt="">
        <span>
          <span class="m">EduTrack</span>
          <span class="s">Staff panel</span>
        </span>
      </div>

      <h1>Sign in</h1>
      <p class="lede">For campus staff. Students sign in on the main site.</p>

      <!-- The heading is set from the server's answer rather than being fixed
           text, so a lock-out reads as a lock-out instead of a wrong password. -->
      <div id="alert" class="notice notice-error" hidden>
        <p class="t" id="alertTitle">Could not sign in</p>
        <p class="d" id="alertText"></p>
      </div>

      <form id="form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false">
          <p class="field-error" id="err-username">Enter your username.</p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password">
          <p class="field-error" id="err-password">Enter your password.</p>
        </div>
        <button type="submit" class="btn" id="submit">Sign in</button>
      </form>

      <p class="signin-foot">
        Authorized users are created by an Administrator. If you do not have access, ask them to add you.
      </p>
    </div>
  </main>

<script>
  const form = document.getElementById('form');
  const submit = document.getElementById('submit');
  const alertBox = document.getElementById('alert');
  const alertText = document.getElementById('alertText');

  let token = null;

  async function getToken() {
    if (token) return token;
    const res = await fetch('../api/csrf-token.php', { credentials: 'same-origin' });
    const data = await res.json();
    token = data.token;
    return token;
  }

  function fail(message, status) {
    // 429 is the throttle, not a bad password. Saying "could not sign in"
    // there sends people back to retype a password that was already right.
    document.getElementById('alertTitle').textContent =
      status === 429 ? 'Too many tries' : 'Could not sign in';
    alertText.textContent = message;
    alertBox.hidden = false;
  }

  function busy(state) {
    submit.disabled = state;
    submit.textContent = state ? 'Signing in…' : 'Sign in';
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    alertBox.hidden = true;
    document.querySelectorAll('.field-error').forEach(el => el.classList.remove('on'));

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    let ok = true;
    if (!username) { document.getElementById('err-username').classList.add('on'); ok = false; }
    if (!password) { document.getElementById('err-password').classList.add('on'); ok = false; }
    if (!ok) return;

    busy(true);
    try {
      const res = await fetch('../api/admin/login.php', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': await getToken() },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!data.ok) {
        token = null;             // it may have been the token that was stale
        busy(false);
        fail(data.error || 'Sign in failed. Please try again.', res.status);
        return;
      }
      window.location.href = 'index.html';
    } catch {
      busy(false);
      fail('Could not reach the server. Check that XAMPP is running, then try again.', 0);
    }
  });
</script>

<script src="http://localhost:8400/live.js?token=039ccad4-fb5c-484e-9552-60ab45ba2e39"></script>

</body>
</html>
