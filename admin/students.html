<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack Staff Panel - Students</title>
<meta name="theme-color" content="#0044d6">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<link rel="stylesheet" href="../assets/css/admin.css?v=15">
<meta name="robots" content="noindex">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <aside class="rail" id="rail"></aside>

  <main class="work" id="main">
    <div class="work-head">
      <h1>Students</h1>
      <p class="work-lede">Everyone who has made an account. Choose a name to see the account and what you can do with it.</p>
    </div>

    <div class="work-body">
      <div class="toolbar">
        <div class="tabs" role="group" aria-label="Show which students">
          <button class="tab" type="button" data-status="all">Everyone</button>
          <button class="tab" type="button" data-status="verified">Can sign in</button>
          <button class="tab" type="button" data-status="pending">Waiting to verify</button>
          <button class="tab" type="button" data-status="off">Turned off</button>
        </div>
        <div class="search">
          <label class="sr-only" for="q">Search by name or email</label>
          <input type="search" id="q" placeholder="Search by name or email">
        </div>
      </div>

      <div class="desk">
        <section class="panel" aria-labelledby="listTitle">
          <div class="panel-head">
            <h2 id="listTitle">All students</h2>
          </div>
          <ul class="rows" id="rows"></ul>
          <div class="pager" id="pager" hidden></div>
        </section>

        <section class="drawer" id="drawer" aria-live="polite"
                 data-empty-title="No student open"
                 data-empty-text="Choose a name on the left to see their account."></section>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/admin/admin.js?v=12"></script>
<script src="students.js?v=1"></script>
</body>
</html>
