<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack Staff Panel - Overview</title>
<meta name="theme-color" content="#0044d6">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<link rel="stylesheet" href="../assets/css/admin.css?v=11">
<meta name="robots" content="noindex">
</head>
<body>
<!--
  THESIS: the staff panel is the same building directory as the student site,
  seen from behind the counter. It refuses the dark dashboard with its own
  palette: one product, one blue, one crest.
  OWN-WORLD: white plates on the blue-grey wall, 1px borders, 6px corners,
  Barlow Condensed headings over Barlow text, an icon beside each section
  in the rail, red only for a real problem.
  STORY: a member of staff signs in, sees what changed, opens a student or a
  room, and acts on it without losing the list.
  FIRST VIEWPORT: icon rail on the left with the crest above it; the page
  title and one line of plain English; four counts that are links; below them
  the map's health and the latest activity.
  FORM: desk and drawer, index 4 of the seven structures listed; seed 40a3bc34.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the
  finish review, the verdict, DESIGN.md, and every shipping raster carrying
  its provenance.
-->
<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <aside class="rail" id="rail"></aside>

  <main class="work" id="main">
    <div class="work-head">
      <div class="page-title-row">
        <div>
          <h1>Overview</h1>
          <p class="work-lede">A clear view of location coverage, route health, and recent Admin activity.</p>
        </div>
      </div>
    </div>

    <div class="work-body">
      <h2 class="sr-only">Navigation overview</h2>
      <div class="counts" id="counts"></div>

      <section class="panel">
        <div class="panel-head"><h2>Navigation Status</h2></div>
        <div class="panel-body" id="problems"></div>
      </section>

      <section class="panel" id="activityPanel" hidden>
        <div class="panel-head">
          <h2>Recent activity</h2>
          <a class="btn btn-quiet btn-small" href="activity.html">See all activity</a>
        </div>
        <ul class="rows" id="recent"></ul>
      </section>
    </div>
  </main>
</div>

<script src="../assets/js/admin/admin.js?v=11"></script>
<script>
(async function () {
  const s = await boot();
  if (!s) return;

  const { data } = await apiGet('overview.php');
  if (!data.ok) {
    toast(data.error || 'Could not load the overview.', 'bad');
    return;
  }

  /* Each figure links to the list it summarises, with the filter already
     applied, so a number is something you can act on rather than just read. */
  const counts = [
    { n: data.rooms.total,      l: 'Mapped Locations',     href: 'rooms.html', tone: '' },
    { n: data.rooms.photos,     l: 'Walkthrough Photos',   href: 'rooms.html', tone: '' },
    { n: data.rooms.reachable,  l: 'Reachable Locations',  href: 'rooms.html', tone: '' },
    { n: data.rooms.problems,   l: 'Navigation Issues',    href: 'rooms.html', tone: data.rooms.problems > 0 ? 'is-bad' : '' }
  ];

  const host = document.getElementById('counts');
  counts.forEach(c => {
    const a = document.createElement('a');
    a.className = 'count-card';
    a.href = c.href;

    const n = document.createElement('span');
    n.className = 'count-n' + (c.tone ? ' ' + c.tone : '');
    n.textContent = c.n;

    const l = document.createElement('span');
    l.className = 'count-l';
    l.textContent = c.l;

    a.append(n, l);
    host.appendChild(a);
  });

  /* Map problems */
  const problems = document.getElementById('problems');
  if (data.problems.length === 0) {
    problems.appendChild(notice('good', '✓ ' + data.rooms.reachable + ' locations have valid routes',
      'All mapped locations currently have valid routes.'));
  } else {
    data.problems.forEach(p => {
      problems.appendChild(notice(p.severity === 'error' ? 'error' : 'warning', p.title, p.detail));
    });
  }

  function notice(kind, title, detail) {
    const el = document.createElement('div');
    el.className = 'notice notice-' + kind;
    const t = document.createElement('p');
    t.className = 't';
    t.textContent = title;
    const d = document.createElement('p');
    d.className = 'd';
    d.textContent = detail;
    el.append(t, d);
    return el;
  }

  /* Recent activity, only for the roles that may read the log */
  if (data.recent && data.recent.length) {
    document.getElementById('activityPanel').hidden = false;
    const list = document.getElementById('recent');

    data.recent.forEach(r => {
      const li = document.createElement('li');
      const row = document.createElement('div');
      row.className = 'row';
      row.style.cursor = 'default';

      const main = document.createElement('div');
      main.className = 'row-main';
      const title = document.createElement('span');
      title.className = 'row-title';
      title.textContent = r.detail || r.action;
      const sub = document.createElement('span');
      sub.className = 'row-sub';
      sub.textContent = r.admin_name;
      main.append(title, sub);

      const end = document.createElement('div');
      end.className = 'row-end';
      const when = document.createElement('span');
      when.className = 'row-when';
      when.textContent = relativeTime(r.created_at);
      end.appendChild(when);

      row.append(main, end);
      li.appendChild(row);
      list.appendChild(li);
    });
  }
})();
</script>

</body>
</html>
