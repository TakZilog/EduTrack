<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack Staff Panel - Activity</title>
<meta name="theme-color" content="#0044d6">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<link rel="stylesheet" href="../assets/css/admin.css?v=5">
<meta name="robots" content="noindex">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <aside class="rail" id="rail"></aside>

  <main class="work" id="main">
    <div class="work-head">
      <h1>Activity</h1>
      <p class="work-lede">A permanent record of everything staff have done in this panel. Nothing here can be edited or removed.</p>
    </div>

    <div class="work-body">
      <div class="toolbar">
        <div>
          <label class="sr-only" for="who">Person</label>
          <select id="who"><option value="">Everyone</option></select>
        </div>
        <div>
          <label class="sr-only" for="what">Action</label>
          <select id="what"><option value="">Every action</option></select>
        </div>
      </div>

      <div class="desk">
        <section class="panel" aria-labelledby="listTitle">
          <div class="panel-head"><h2 id="listTitle">What has happened</h2></div>
          <ul class="rows" id="rows"></ul>
          <div class="pager" id="pager" hidden></div>
        </section>

        <section class="drawer" id="drawer" aria-live="polite"
                 data-empty-title="No entry open"
                 data-empty-text="Choose a line on the left to see the whole entry."></section>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/admin/admin.js?v=5"></script>
<script>
(async function () {
  const s = await boot();
  if (!s) return;

  const rows = document.getElementById('rows');
  const pager = document.getElementById('pager');
  const drawer = document.getElementById('drawer');
  const whoSelect = document.getElementById('who');
  const whatSelect = document.getElementById('what');

  const state = { who: '', action: '', page: 1, openKey: null };
  let filtersBuilt = false;

  /* The stored action name is a dotted key; these are the words for it. */
  const WORDS = {
    'admin.login': 'Signed in',
    'admin.logout': 'Signed out',
    'admin.create': 'Added a staff account',
    'admin.enable': 'Turned a staff account on',
    'admin.disable': 'Turned a staff account off',
    'student.verify': 'Marked a student verified',
    'student.deactivate': 'Turned a student account off',
    'student.reactivate': 'Turned a student account on',
    'student.delete': 'Deleted a student',
    'settings.save': 'Changed settings',
    'access.denied': 'Was refused access'
  };

  whoSelect.addEventListener('change', e => { state.who = e.target.value; state.page = 1; load(); });
  whatSelect.addEventListener('change', e => { state.action = e.target.value; state.page = 1; load(); });

  /* Entries have no id of their own, so an open one is remembered by the
     things that make it unique: when it happened, who did it, and what. */
  const keyOf = entry => entry.created_at + '|' + entry.admin_name + '|' + entry.action;

  async function load() {
    showSkeleton(rows, 8);
    const { data } = await apiGet('activity.php', {
      who: state.who, action: state.action, page: state.page
    });

    if (!data.ok) { toast(data.error || 'Could not load the activity log.', 'bad'); return; }

    if (!filtersBuilt) {
      data.people.forEach(p => {
        const o = document.createElement('option');
        o.value = p; o.textContent = p;
        whoSelect.appendChild(o);
      });
      data.actions.forEach(a => {
        const o = document.createElement('option');
        o.value = a; o.textContent = WORDS[a] || a;
        whatSelect.appendChild(o);
      });
      filtersBuilt = true;
    }

    if (data.data.length === 0) {
      const filtered = state.who !== '' || state.action !== '';
      showEmpty(rows,
        filtered ? 'Nothing matches' : 'Nothing has happened yet',
        filtered
          ? 'No activity fits the filters you chose.'
          : 'Actions taken in this panel will be listed here as they happen.',
        filtered ? 'Clear the filters' : null,
        filtered ? () => {
          state.who = ''; state.action = ''; state.page = 1;
          whoSelect.value = ''; whatSelect.value = '';
          load();
        } : null);
      drawPager(pager, data, () => {});
      openEntry(null);
      return;
    }

    rows.replaceChildren();
    data.data.forEach(entry => {
      const end = [];
      // A refused attempt is the one thing in this list worth a red mark.
      if (entry.action === 'access.denied') end.push(pill('Refused', 'revoked'));
      const when = document.createElement('span');
      when.className = 'row-when';
      when.textContent = relativeTime(entry.created_at);
      end.push(when);

      rows.appendChild(listRow({
        title: WORDS[entry.action] || entry.action,
        sub: entry.admin_name + (entry.detail ? ' · ' + entry.detail : ''),
        end,
        selected: keyOf(entry) === state.openKey,
        onOpen: row => { markOpenRow(rows, row); openEntry(entry); }
      }));
    });

    drawPager(pager, data, page => { state.page = page; load(); });

    const still = data.data.find(e => keyOf(e) === state.openKey);
    openEntry(still || null);
  }

  function openEntry(entry) {
    state.openKey = entry ? keyOf(entry) : null;

    if (!entry) { drawDrawer(drawer, null); return; }

    const ip = document.createElement('span');
    ip.className = 'mono';
    ip.textContent = entry.ip || '—';

    drawDrawer(drawer, {
      title: WORDS[entry.action] || entry.action,
      sub: relativeTime(entry.created_at),
      body: facts([
        ['Who', entry.admin_name],
        ['Their access level', entry.role],
        ['Exactly when', formatDateTime(entry.created_at)],
        ['Details', entry.detail || 'None recorded'],
        ['From this address', ip]
      ])
    });
  }

  drawDrawer(drawer, null);
  load();
})();
</script>
</body>
</html>
