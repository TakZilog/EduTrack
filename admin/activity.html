<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack Staff Panel - Activity Log</title>
<meta name="theme-color" content="#1A73E8">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<link rel="stylesheet" href="../assets/css/admin.css?v=12">
<meta name="robots" content="noindex">
</head>
<body class="activity-page">
<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <aside class="rail" id="rail"></aside>

  <main class="work" id="main">
    <div class="work-head">
      <div class="page-title-row">
        <div>
          <h1>Activity Log</h1>
          <p class="work-lede">A permanent record of actions performed in EduTrack. Entries cannot be edited or removed.</p>
        </div>
        <div class="export-menu">
          <button class="btn btn-quiet btn-small" id="exportToggle" type="button" aria-expanded="false" aria-controls="exportMenu">
            Export Log <span class="export-caret" aria-hidden="true"></span>
          </button>
          <div class="export-menu-popover" id="exportMenu" hidden>
            <button type="button" id="exportCsv">Export CSV</button>
            <button type="button" id="exportPdf">Export PDF</button>
          </div>
        </div>
      </div>
    </div>

    <div class="work-body">
      <div class="activity-filters" role="search" aria-label="Filter activity log">
        <label class="activity-search">
          <span class="sr-only">Search activity</span>
          <input id="search" type="search" placeholder="Search activity..." autocomplete="off">
        </label>
        <label>
          <span class="sr-only">Person</span>
          <select id="who"><option value="">Everyone</option></select>
        </label>
        <label>
          <span class="sr-only">Action</span>
          <select id="what"><option value="">Every action</option></select>
        </label>
        <label>
          <span class="sr-only">Date</span>
          <select id="date">
            <option value="">Date</option>
            <option value="today">Today</option>
            <option value="yesterday">Yesterday</option>
            <option value="7d">Last 7 days</option>
            <option value="30d">Last 30 days</option>
            <option value="custom">Custom date</option>
          </select>
        </label>
        <div class="custom-dates" id="customDates" hidden>
          <label><span class="sr-only">From date</span><input id="dateFrom" type="date"></label>
          <span aria-hidden="true">to</span>
          <label><span class="sr-only">To date</span><input id="dateTo" type="date"></label>
        </div>
      </div>

      <div class="desk">
        <section class="panel" aria-labelledby="listTitle">
          <div class="panel-head"><h2 id="listTitle">Activity Log</h2></div>
          <ul class="rows" id="rows" aria-live="polite"></ul>
          <div class="pager" id="pager" hidden></div>
        </section>

        <section class="drawer" id="drawer" aria-live="polite"
                 data-empty-title="No entry selected"
                 data-empty-text="Select an activity from the list to view its complete details."></section>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/admin/admin.js?v=12"></script>
<script src="activity.js?v=1"></script>
</body>
</html>
