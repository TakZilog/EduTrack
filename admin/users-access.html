<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack Staff Panel - Users &amp; Access</title>
<meta name="theme-color" content="#1A73E8">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<link rel="stylesheet" href="../assets/css/admin.css?v=14">
<meta name="robots" content="noindex">
</head>
<body class="users-page">
<a class="skip-link" href="#main">Skip to content</a>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="work" id="main">
    <div class="work-head page-title-row">
      <div>
        <h1>Users &amp; Access</h1>
        <p class="work-lede">The people who can sign in to this staff panel, and what each of them may do.</p>
      </div>
    </div>
    <div class="work-body">
      <div class="desk">
        <section class="panel" aria-labelledby="usersTitle">
          <div class="panel-head"><h2 id="usersTitle">Staff accounts</h2></div>
          <ul class="rows" id="adminRows"></ul>
        </section>
        <section class="drawer" id="drawer" aria-live="polite"
                 data-empty-title="No one selected"
                 data-empty-text="Choose a person from the list to see what they can do."></section>
      </div>
      <section class="panel" id="createUserPanel">
        <div class="panel-head">
          <div>
            <h2>Add a person</h2>
            <p class="section-lede">Give them only the access their work needs.</p>
          </div>
        </div>
        <div class="panel-body">
          <form id="addForm">
            <div class="form-grid">
              <div class="field"><label for="newName">Full name</label><input type="text" id="newName" autocomplete="off" maxlength="100"></div>
              <div class="field"><label for="newUsername">Username</label><input type="text" id="newUsername" autocomplete="off" autocapitalize="none" spellcheck="false"><p class="field-hint">What they type to sign in. 4 or more letters or numbers.</p></div>
              <div class="field"><label for="newRole">Access level</label><select id="newRole"></select><p class="field-hint" id="newRoleHint"></p></div>
              <div class="field"><label for="newPassword">Password</label><input type="password" id="newPassword" autocomplete="new-password"><p class="field-hint" id="newPasswordHint"></p></div>
              <div class="field"><label for="newPassword2">Repeat the password</label><input type="password" id="newPassword2" autocomplete="new-password"></div>
            </div>
            <label class="show-passwords"><input type="checkbox" id="showNew"> Show passwords</label>
            <p class="field-error" id="addError"></p>
            <button type="submit" class="btn" id="addBtn">Add Staff</button>
          </form>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="../assets/js/admin/admin.js?v=12"></script>
<script src="users-access.js?v=4"></script>
</body>
</html>
