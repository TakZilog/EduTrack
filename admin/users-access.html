<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack Staff Panel - Users &amp; Access</title>
<meta name="theme-color" content="#1A73E8">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<link rel="stylesheet" href="../assets/css/admin.css?v=12">
<meta name="robots" content="noindex">
</head>
<body class="users-page">
<a class="skip-link" href="#main">Skip to content</a>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="work" id="main">
    <div class="work-head page-title-row">
      <div>
        <h1>Users &amp; Access</h1>
        <p class="work-lede">Manage people authorized to access the EduTrack Admin Panel.</p>
      </div>
      <button type="button" class="btn" id="createUserTop">+ Create User</button>
    </div>
    <div class="work-body">
      <div class="desk">
        <section class="panel" aria-labelledby="usersTitle">
          <div class="panel-head"><h2 id="usersTitle">Authorized Users</h2></div>
          <ul class="rows" id="adminRows"></ul>
        </section>
        <section class="drawer" id="drawer" aria-live="polite"
                 data-empty-title="No user selected"
                 data-empty-text="Select an authorized user to view access details."></section>
      </div>
      <section class="panel" id="createUserPanel">
        <div class="panel-head">
          <div>
            <h2>Create User</h2>
            <p class="section-lede">Assign the access needed to manage EduTrack.</p>
          </div>
        </div>
        <div class="panel-body">
          <form id="addForm">
            <div class="form-grid">
              <div class="field"><label for="newName">Full Name</label><input type="text" id="newName" autocomplete="off" maxlength="100"></div>
              <div class="field"><label for="newUsername">Username</label><input type="text" id="newUsername" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
              <div class="field"><label for="newRole">Access Level</label><select id="newRole"><option value="faculty">View Only</option><option value="admin">Map Editor</option><option value="super_admin">Administrator</option></select></div>
              <div class="field"><label for="newPassword">Password</label><input type="password" id="newPassword" autocomplete="new-password"><p class="field-hint">Minimum 15 characters.</p></div>
            </div>
            <p class="field-error" id="addError"></p>
            <button type="submit" class="btn" id="addBtn">Create User</button>
          </form>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="../assets/js/admin/admin.js?v=12"></script>
<script src="users-access.js?v=1"></script>
</body>
</html>
