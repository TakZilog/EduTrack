 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack Staff Panel - Navigation Map</title>
<meta name="theme-color" content="#1A73E8">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<link rel="stylesheet" href="../assets/css/admin.css?v=11">
<meta name="robots" content="noindex">
</head>
<body class="navigation-page">
<a class="skip-link" href="#main">Skip to content</a>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="work" id="main">
    <div class="work-head">
      <div class="page-title-row">
        <div>
          <h1>Navigation Map</h1>
          <p class="work-lede">Review and maintain indoor routes, walkthrough connections, and navigation health.</p>
        </div>
      </div>
    </div>
    <div class="work-body">
      <div class="navigation-toolbar" role="search" aria-label="Choose a route">
        <label>
          <span class="sr-only">Floor</span>
          <select id="mapFloor"><option value="">Floor</option></select>
        </label>
        <label class="navigation-location-select">
          <span class="sr-only">Select Location</span>
          <select id="mapLocation"><option value="">Select Location</option></select>
        </label>
        <label>
          <span class="sr-only">Route Status</span>
          <select id="mapStatus"><option value="">Route Status</option><option value="reachable">Reachable</option><option value="unreachable">Needs attention</option></select>
        </label>
      </div>

      <section class="panel navigation-workspace" aria-labelledby="routeTitle">
        <div class="panel-head"><h2 id="routeTitle">Route Structure</h2></div>
        <div class="panel-body" id="routeWorkspace">
          <div class="route-empty"><strong>Select a location</strong><span>Choose a floor and location to inspect its route connections and walkthrough.</span></div>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="../assets/js/admin/admin.js?v=11"></script>
<script src="navigation-map.js?v=1"></script>

</body>
</html>
