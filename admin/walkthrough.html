<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack Staff Panel - Walkthrough</title>
<meta name="theme-color" content="#1A73E8">
<link rel="icon" href="../assets/img/aclc-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=7">
<link rel="stylesheet" href="../assets/css/admin.css?v=15">
<meta name="robots" content="noindex">
</head>
<body class="walkthrough-page">
<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <aside class="rail" id="rail"></aside>

  <main class="work" id="main">
    <div class="work-head">
      <div>
        <h1>Walkthrough</h1>
        <p class="work-lede">Change the photos visitors walk through. Pick a building and floor, then a room.</p>
      </div>
    </div>

    <div class="work-body">
      <div class="wt-where" role="search" aria-label="Choose where">
        <div class="wt-choice">
          <label for="where">Building and floor</label>
          <select id="where" disabled><option>Loading…</option></select>
        </div>
        <div class="wt-choice">
          <label for="room">Room</label>
          <select id="room" disabled><option value="">All rooms on this floor</option></select>
        </div>
      </div>

      <div id="floorView"></div>
    </div>
  </main>
</div>

<script src="../assets/js/admin/admin.js?v=12"></script>
<script src="walkthrough.js?v=1"></script>
</body>
</html>
